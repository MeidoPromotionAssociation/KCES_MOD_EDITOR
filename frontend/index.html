<!DOCTYPE html>
<!-- data-file-drop-target: Wails 运行时只把带该属性的元素（及其子元素）当作文件拖放目标，
     放在 html 上以覆盖整个窗口，包括渲染到 body 下的 antd 弹层 -->
<html lang="en-US" data-file-drop-target>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>KCES MOD EDITOR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
